name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: Win64
          - os: ubuntu-latest
            target: Android64
          - os: ubuntu-latest
            target: Android32

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Clean all build artifacts and caches
        shell: bash
        run: |
          rm -rf cpm-cache
          rm -rf build
          rm -rf .sccache
          rm -rf CMakeFiles
          rm -f CMakeCache.txt
        continue-on-error: true

      - name: Use older, compatible Android NDK
        if: runner.os == 'Linux'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Point geode-sdk build action at the r27c NDK
        # geode-sdk/build-geode-mod은 android-ndk-version 입력이 없으면
        # $ANDROID_NDK_LATEST_HOME(러너에 기본 설치된 최신 NDK)을 그대로 써버려서,
        # 위에서 설치한 r27c가 무시되고 있었음. 환경변수를 직접 덮어써서 강제 적용.
        if: runner.os == 'Linux'
        shell: bash
        run: echo "ANDROID_NDK_LATEST_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Create build directory
        shell: bash
        run: mkdir -p build

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
        env:
          CMAKE_SUPPRESS_DEVELOPER_WARNINGS: "ON"
          # 최신 CMake는 너무 오래된 cmake_minimum_required(3.5 미만)를 요구하는
          # 의존성(result 등)을 거부함 - 최소 정책 버전을 지정해 우회
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Upload result
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coop-mod-${{ matrix.target }}
          path: build/*.geode

      - name: Debug on failure
        if: failure()
        shell: bash
        run: |
          find . -name "CMakeError.log" -o -name "CMakeOutput.log" 2>/dev/null | while read f; do
            echo "File: $f"
            head -50 "$f"
          done
          ls -la cpm-cache/ 2>/dev/null || echo "No cpm-cache"
